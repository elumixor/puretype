name: Deploy

# A push to main deploys the API (puretype-api) and the web app (puretype) to Devkit Cloud through the dk-deploy
# OIDC role. Vercel never deploys a push on its own (vercel.json).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::453953529857:role/dk-deploy
          aws-region: eu-central-1
      - run: bun install && bunx devkit deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
